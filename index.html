<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>和尚逆天</title>
  <meta name="description" content="《和尚逆天》——破戒之僧，逆天而行。" />
  <link rel="icon" href="./media/img/woodfish.svg" type="image/svg+xml" />
  <script type="module" crossorigin src="./assets/index-B5Lzw4gy.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BROWbDz4.css">
</head>
<body>
  <!-- Loader（overlay，不算 section，spec §5.1） -->
  <div id="loader" role="dialog" aria-label="進站儀式">
    <button class="loader-woodfish-btn" type="button" aria-disabled="true" aria-label="叩木魚，開山門">
      <img class="loader-woodfish" src="./media/img/woodfish.webp" alt="" width="512" height="512" />
    </button>
    <p class="loader-hint">叩木魚，開山門</p>
    <button class="loader-skip" type="button">直接進入</button>
  </div>

  <main>
    <!-- 1. Hero（§5.2；PV 實錄未到位：poster 靜態佔位，video 結構空掛 data-placeholder） -->
    <section id="hero" aria-labelledby="hero-heading">
      <div class="hero-bg" aria-hidden="true">
        <picture>
          <source srcset="media/img/poster_828.avif 828w, media/img/poster.avif 1920w" sizes="100vw" type="image/avif" />
          <img class="hero-poster" src="./media/img/poster.webp"
               srcset="media/img/poster_828.webp 828w, media/img/poster.webp 1920w" sizes="100vw"
               alt="" width="1920" height="1072" fetchpriority="high" />
        </picture>
        <video class="hero-video" muted autoplay loop playsinline preload="none"
               poster="./media/img/poster.webp" data-placeholder>
          <source data-src="" type="video/webm" />
          <source data-src="" type="video/mp4" />
        </video>
        <div class="hero-shade"></div>
      </div>
      <div class="section-inner hero-fg">
        <!-- Logo 圖未到位：文字排版佔位（Noto Serif TC 900），等 Codex logo -->
        <h1 id="hero-heading" class="hero-logo" data-todo>和尚逆天</h1>
        <p class="hero-tagline">破戒之僧，逆天而行</p>
        <div class="hero-cta-row">
          <button class="cut-btn hero-pv-btn" type="button">▶ 觀看完整 PV</button>
          <a class="cut-btn" href="https://wanintw-my.sharepoint.com/:u:/g/personal/annie_lee_wanin_tw/IQANqyHtdj-wT4r8bnk2v6a7AbbxW6g7Iv1uSWWGJh2H3a0?e=ELq0PU"
             target="_blank" rel="noopener">下載 Demo</a>
        </div>
      </div>
    </section>

    <!-- 2. Story（§5.3 水墨絵巻・橫向捲軸，M3；佔位素材見 story.css 頂部註解） -->
    <section id="story" aria-labelledby="story-heading">
      <h2 id="story-heading" class="story-heading-sr">水墨絵巻・世界觀</h2>
      <div class="story-stage">
        <div class="scroll-layer story-layer-far" data-speed="0.4" aria-hidden="true"></div>
        <div class="scroll-layer story-layer-mid" data-speed="0.7" data-placeholder aria-hidden="true"></div>
        <div class="scroll-layer story-layer-fg" data-speed="1">
          <div class="story-fg-figure" aria-hidden="true" data-placeholder>
            <img src="./media/img/story_fg_wujie.webp" alt="" width="720" height="1200" loading="lazy" />
          </div>
          <div class="story-card" data-card="0">
            <p></p>
          </div>
          <div class="story-card" data-card="1">
            <p></p>
          </div>
          <div class="story-card" data-card="2">
            <p></p>
          </div>
          <div class="story-card" data-card="3">
            <p></p>
            <p class="story-card-sub">PANTHEON GROUP</p>
          </div>
        </div>
        <div class="story-fade-edge story-fade-edge--start" aria-hidden="true"></div>
        <div class="story-fade-edge story-fade-edge--end" aria-hidden="true"></div>
      </div>
    </section>

    <!-- 3. Characters（§5.4，M4） -->
    <section id="characters" aria-labelledby="characters-heading">
      <h2 id="characters-heading" data-en="CHARACTERS">角色堂</h2>
      <p>破戒僧、其師，與萬神殿十二神</p>
      <div class="main-cards" aria-hidden="true"></div>
      <div class="god-grid" aria-hidden="true"></div>
    </section>

    <!-- 4. Gameplay -->
    <section id="gameplay" aria-labelledby="gameplay-heading">
      <h2 id="gameplay-heading" data-en="GAMEPLAY">玩法四象</h2>
      <p data-intro>四種玩法，一場修行</p>
      <div class="quad-grid" aria-hidden="true"></div>
    </section>

    <!-- 5. Gallery（原 6；地下遊藝場區塊 2026-07-17 使用者指示整段移除） -->
    <section id="gallery" aria-labelledby="gallery-heading">
      <h2 id="gallery-heading" data-en="EMA GALLERY">繪馬堂</h2>
      <p data-intro>一景一願，皆掛於此</p>
      <div class="gallery-marquee" aria-hidden="true"></div>
    </section>

    <!-- 6. Footer -->
    <section id="footer" aria-labelledby="footer-heading">
      <h2 id="footer-heading" class="sr-only">頁尾</h2>
      <button class="footer-woodfish-btn" type="button" aria-label="敲一下木魚">
        <img class="footer-logo" src="./media/img/woodfish.webp" alt="" width="512" height="512" loading="lazy" />
      </button>
      <p data-tagline>破戒之僧，逆天而行。</p>
      <p class="footer-credit"></p>
    </section>
  </main>

  <!-- PV lightbox 骨架（§5.2；內容佔位，PV 成片後換 <video>） -->
  <div id="pv-lightbox" role="dialog" aria-modal="true" aria-label="完整 PV" hidden>
    <button class="pv-lightbox-close" type="button" aria-label="關閉">✕</button>
    <p class="pv-lightbox-placeholder" data-todo>PV 製作中</p>
  </div>

</body>
</html>
